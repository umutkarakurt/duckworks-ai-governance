[project]
name = "duckworks-pondgpt-security-lab"
version = "0.1.0"
description = "Synthetic PondGPT PG-03 technical security validation lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
